<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      :root {
        --ground: #000000;
        --ink: #ffffff;
        --dim: #aeaeb4;
        --dim2: #6b6b72;
        --red: #ff2a2a;
        --green: #34d399;
        --panel: #111113;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 3840px;
        height: 2160px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .bgfx {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 20% 15%, rgba(255, 42, 42, 0.08), transparent 45%),
          radial-gradient(circle at 85% 85%, rgba(52, 211, 153, 0.06), transparent 50%);
      }

      /* ---- title ---- */
      .h1 {
        position: absolute;
        top: 96px;
        left: 0;
        width: 100%;
        text-align: center;
        color: var(--ink);
        font-weight: 800;
        font-size: 60px;
        letter-spacing: -1px;
      }
      .h1 em {
        color: var(--red);
        font-style: normal;
      }

      /* ---- phone mockup ---- */
      .phone {
        position: absolute;
        left: 760px;
        top: 230px;
        width: 400px;
        height: 760px;
        border-radius: 50px;
        border: 4px solid var(--dim);
        background: rgba(255, 255, 255, 0.015);
      }
      .phone-notch {
        position: absolute;
        left: 960px;
        top: 252px;
        transform: translate(-50%, 0);
        width: 110px;
        height: 14px;
        border-radius: 8px;
        background: var(--dim2);
      }

      .pill {
        position: absolute;
        left: 840px;
        top: 302px;
        width: 240px;
        height: 56px;
        border-radius: 28px;
        border: 3px solid var(--dim);
        background: var(--panel);
      }
      .pill-label {
        position: absolute;
        left: 960px;
        top: 330px;
        transform: translate(-50%, -50%);
        color: var(--dim);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 2px;
      }

      .bar {
        position: absolute;
        left: 830px;
        width: 260px;
        height: 22px;
        border-radius: 11px;
        background: var(--panel);
        border: 2px solid #242428;
      }

      .portrait {
        position: absolute;
        left: 890px;
        top: 290px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 4px solid var(--red);
        background: radial-gradient(circle, var(--panel), #000);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .portrait svg {
        width: 64px;
        height: 64px;
        color: var(--dim);
      }

      .problem-glow {
        position: absolute;
        left: 960px;
        top: 360px;
        transform: translate(-50%, -50%);
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 42, 42, 0.35), transparent 65%);
      }

      /* ---- icon badges (shared visual system) ---- */
      .badge-wrap {
        position: absolute;
        transform: translate(-50%, -50%);
      }
      .badge {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--panel), #000);
        border: 2px solid #242428;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge.glow-red {
        border-color: var(--red);
        box-shadow: 0 0 60px -8px rgba(255, 42, 42, 0.72);
      }
      .badge.glow-ink {
        border-color: var(--ink);
        box-shadow: 0 0 60px -8px rgba(255, 255, 255, 0.41);
      }
      .badge svg {
        width: 58px;
        height: 58px;
      }
      .ic-ink {
        color: #ffffff;
      }
      .ic-red {
        color: var(--red);
      }
      .ic-green {
        color: var(--green);
      }

      .label {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translate(-50%, 18px);
        width: 380px;
        white-space: nowrap;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: 1px;
        color: var(--dim);
        text-align: center;
      }

      .fence-label {
        position: absolute;
        left: 960px;
        top: 730px;
        transform: translate(-50%, -50%);
        width: 340px;
        white-space: normal;
        line-height: 1.3;
        text-align: center;
        color: var(--green);
        font-weight: 800;
        font-size: 28px;
        letter-spacing: 1px;
      }

      svg.phonefx {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      path.fence {
        fill: none;
        stroke: var(--green);
        stroke-width: 4;
        stroke-dasharray: 14 10;
        stroke-linejoin: round;
        pathLength: 1;
        filter: drop-shadow(0 0 7px rgba(52, 211, 153, 0.55));
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.5" data-width="3840" data-height="2160">
    <div id="stage" style="position:absolute; top:0; left:0; width:1920px; height:1080px; transform: scale(2); transform-origin: top left;">
      <div class="bgfx" data-layout-ignore></div>

      <!-- TITLE: persists whole clip -->
      <div id="titleGroup" class="clip" data-start="0" data-duration="15.5" data-track-index="0">
        <div id="h1" class="h1">How to Ask for a <em>Fix</em></div>
      </div>

      <!-- PHONE MOCKUP -->
      <div id="phoneGroup" class="clip" data-start="0.3" data-duration="15.2" data-track-index="1">
        <div id="phone" class="phone" style="opacity: 0"></div>
        <div id="notch" class="phone-notch" style="opacity: 0"></div>

        <div id="bar1" class="bar" style="top: 549px; opacity: 0"></div>
        <div id="bar2" class="bar" style="top: 599px; opacity: 0"></div>
        <div id="bar3" class="bar" style="top: 649px; opacity: 0"></div>

        <div id="pill" class="pill" style="opacity: 0"></div>
        <div id="pillLabel" class="pill-label" style="opacity: 0" data-layout-allow-occlusion data-layout-ignore>SAVE</div>

        <!-- the overlap bug: portrait circle sits on top of the button -->
        <div id="portrait" class="portrait" style="opacity: 0">
          <svg class="ic-ink" viewBox="0 0 64 64"><use href="#ic-user" /></svg>
        </div>

        <div id="problemGlow" class="problem-glow" style="opacity: 0"></div>

        <!-- magnifying glass finds the problem -->
        <div class="badge-wrap" style="left: 1260px; top: 360px">
          <div id="magnifyBadge" class="badge glow-ink" style="opacity: 0">
            <svg class="ic-ink" viewBox="0 0 64 64"><use href="#ic-magnify" /></svg>
          </div>
          <div id="magnifyLabel" class="label" style="opacity: 0" data-layout-allow-overflow>FINDING THE BUG</div>
        </div>

        <!-- warning icon flags the overlap -->
        <div class="badge-wrap" style="left: 1260px; top: 360px">
          <div id="warnBadge" class="badge glow-red" style="opacity: 0">
            <svg class="ic-red" viewBox="0 0 64 64"><use href="#ic-warn" /></svg>
          </div>
          <div id="warnLabel" class="label" style="opacity: 0" data-layout-allow-overflow>OVERLAPPING ELEMENTS</div>
        </div>

        <!-- fence locks everything else once the portrait is resolved -->
        <svg class="phonefx" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <path id="fencePath" class="fence" d="M 790,280 h 340 v 410 h -340 z" style="opacity: 0" />
        </svg>
        <div id="fenceLabel" class="fence-label" style="opacity: 0">LOCKED &mdash; DO NOT TOUCH</div>
      </div>

      <!-- icon sprite, no timing -->
      <svg style="display: none" aria-hidden="true">
        <defs>
          <symbol id="ic-user" viewBox="0 0 64 64">
            <circle cx="32" cy="22" r="12" fill="none" stroke="currentColor" stroke-width="3.5" />
            <path d="M12 54c0-12 9-20 20-20s20 8 20 20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
          </symbol>
          <symbol id="ic-magnify" viewBox="0 0 64 64">
            <circle cx="27" cy="27" r="16" fill="none" stroke="currentColor" stroke-width="4" />
            <path d="M39 39 L54 54" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
          </symbol>
          <symbol id="ic-warn" viewBox="0 0 64 64">
            <path d="M32 8 L58 54 H6 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
            <path d="M32 24v16" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
            <circle cx="32" cy="46" r="2.6" fill="currentColor" />
          </symbol>
        </defs>
      </svg>
    </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const pop = { duration: 0.45, ease: "back.out(1.9)" };
      const fade = { duration: 0.4, ease: "power2.out" };

      // ---- title: already on screen at frame 0 (thumbnail-safe), settles in with a slight slide ----
      tl.fromTo("#h1", { y: -10 }, { y: 0, ...fade }, 0);

      // ---- phone chrome fades in with the overlap already visible (problem state) ----
      tl.fromTo("#phone", { opacity: 0, scale: 0.96, xPercent: 0, yPercent: 0 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 0.4);
      tl.fromTo("#notch", { opacity: 0 }, { opacity: 1, ...fade }, 0.5);

      tl.fromTo("#pill", { opacity: 0 }, { opacity: 1, ...fade }, 0.65);
      tl.fromTo("#pillLabel", { opacity: 0 }, { opacity: 1, ...fade }, 0.75);

      tl.fromTo("#bar1", { opacity: 0 }, { opacity: 1, ...fade }, 0.8);
      tl.fromTo("#bar2", { opacity: 0 }, { opacity: 1, ...fade }, 0.9);
      tl.fromTo("#bar3", { opacity: 0 }, { opacity: 1, ...fade }, 1.0);

      // portrait appears already overlapping the pill -- this is the bug
      tl.fromTo("#portrait", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, ...pop }, 0.7);
      tl.fromTo("#problemGlow", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.1);

      // ---- magnifying glass finds the overlap ----
      tl.fromTo("#magnifyBadge", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, ...pop }, 1.6);
      tl.fromTo("#magnifyLabel", { opacity: 0 }, { opacity: 1, ...fade }, 1.85);
      tl.to(["#magnifyBadge", "#magnifyLabel"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 3.25);

      // ---- warning icon flags it, pulses a deterministic finite number of times ----
      tl.fromTo("#warnBadge", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, ...pop }, 3.6);
      tl.fromTo("#warnLabel", { opacity: 0 }, { opacity: 1, ...fade }, 3.85);
      tl.to("#warnBadge", { opacity: 0.35, duration: 0.3, ease: "sine.inOut", repeat: 7, yoyo: true }, 4.2);

      tl.to(["#warnBadge", "#warnLabel", "#problemGlow"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 6.6);

      // ---- THE FIX: portrait slides down below the button and shrinks, resolving the overlap live ----
      tl.to(
        "#portrait",
        { y: 520, scale: 0.7, borderColor: "#c7c7cc", duration: 1.1, ease: "power2.inOut" },
        7.0,
      );
      tl.to("#pillLabel", { color: "#ffffff", duration: 0.5 }, 7.4);

      // ---- fence draws itself around everything except the portrait that just moved ----
      tl.fromTo("#fencePath", { opacity: 0, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 8.3);
      tl.fromTo("#fenceLabel", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 9.9);

      // hold the resolved, fenced state for the remainder of the clip
      // (no further tweens -- last state persists through to the end)

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
